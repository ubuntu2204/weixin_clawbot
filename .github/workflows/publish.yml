name: Publish to pub.dev

# 对齐 pp_ocr 的发布方式：本机无法直连 pub.dev，凭据以 base64 存入仓库 Secret
# PUB_CREDENTIALS_B64（内容为本机 ~/.config/dart/pub-credentials.json 的 base64）。
# Action 只负责推送到 pub.dev，不跑 analyze/test。
# 触发：push vX.Y.Z tag（如 v0.5.3）。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本包声明了 flutter SDK 约束，需 Flutter 环境才能解析依赖并发布。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - env:
          PUB_CREDENTIALS_B64: ${{ secrets.PUB_CREDENTIALS_B64 }}
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS_B64" | base64 -d > ~/.config/dart/pub-credentials.json
          chmod 600 ~/.config/dart/pub-credentials.json
      - run: flutter pub publish --force
