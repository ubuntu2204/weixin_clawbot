name: weixin_clawbot
description: >
  A pure Dart package for binding WeChat via QR code and receiving/sending
  messages through the WeChat iLink Bot API (OpenClaw ClawBot). Works with
  both SDKs: Dart servers/CLIs and Flutter mobile/desktop/web apps. The core
  protocol layer has no Flutter dependency; a ready-made Flutter login UI is
  included in the package's example app (lib/qr_login_widget.dart).
version: 0.4.0
homepage: https://github.com/ubuntu2204/weixin_clawbot
repository: https://github.com/ubuntu2204/weixin_clawbot
issue_tracker: https://github.com/ubuntu2204/weixin_clawbot/issues
topics:
  - wechat
  - dart
  - http
  - api

environment:
  sdk: '>=3.4.0 <4.0.0'
  # 仅声明 Flutter SDK 兼容（Flutter 项目可直接依赖本包）；不引入 flutter 依赖，
  # 纯 Dart 服务器照常解析。pub.dev 因此显示 Dart + Flutter 双 SDK 徽章。
  flutter: '>=3.19.0'

dependencies:
  http: ^1.2.0
  uuid: ^4.4.0
  # AES-128-ECB decryption for inbound CDN media (images/files/videos)
  pointycastle: ^3.9.1
  # Browser localStorage backend for AccountStore (Flutter Web / Dart web)
  web: ^1.1.0
  # Default file path handling for the native file storage backend
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
