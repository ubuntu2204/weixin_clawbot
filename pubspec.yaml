name: weixin_clawbot
description: >
  A Flutter package for binding WeChat via QR code and receiving/sending messages
  through the WeChat iLink Bot API (OpenClaw ClawBot).
version: 0.2.0
homepage: https://github.com/ubuntu2204/weixin_clawbot
repository: https://github.com/ubuntu2204/weixin_clawbot
issue_tracker: https://github.com/ubuntu2204/weixin_clawbot/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  # AES-128-ECB decryption for inbound CDN media (images/files/videos)
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # This package does not use Flutter's asset system directly.
